[versions]
spring-boot = "3.3.1"
spring-dependency = "1.1.5"
kotlin = "2.0.0"

[libraries]
spring-amqp = { group = "org.springframework.boot", name = "spring-boot-starter-amqp" }
spring-starter = { group = "org.springframework.boot", name = "spring-boot-starter-web" }
jackson-kotlin = { group = "com.fasterxml.jackson.module", name = "jackson-module-kotlin" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect" }
lombok = { group = "org.projectlombok", name = "lombok" }
spring-devtools = { group = "org.springframework.boot", name = "spring-boot-devtools" }
spring-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }
spring-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5" }
spring-rabbit-test = { group = "org.springframework.amqp", name = "spring-rabbit-test" }
junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
spring-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency = { id = "io.spring.dependency-management", version.ref = "spring-dependency" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }